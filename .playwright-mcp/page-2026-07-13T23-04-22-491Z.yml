  - main [ref=e31]:
    - 'heading "How to Tell if Your Tree Is Sick: Warning Signs Atlanta Homeowners Miss" [level=1] [ref=e33]'
    - generic [ref=e34]:
      - figure [ref=e35]:
        - img "Signs of a sick tree in a Metro Atlanta yard" [ref=e36]
      - paragraph [ref=e37]: Trees can't tell you when they feel off, so you have to read the clues. Learning how to tell if your tree is sick early on can save the tree, save you money, and keep a big limb from landing on your roof. Here in Metro Atlanta, our oaks, pines, and crape myrtles deal with heavy clay soil, long humid summers, and storm after storm. That mix stresses trees and opens the door to trouble.
      - paragraph [ref=e38]: The good news is that most sick trees give you plenty of warning. You just have to know what to look for. Let's walk through the signs, one part of the tree at a time.
      - heading "Start with the leaves" [level=2] [ref=e39]
      - paragraph [ref=e40]: Leaves are the easiest place to catch problems. A healthy tree in summer should be full and green. When something's wrong, the leaves usually show it first.
      - paragraph [ref=e41]: "Here are the leaf signs of a sick tree to watch for:"
      - list [ref=e42]:
        - listitem [ref=e43]: Yellow, brown, or spotted leaves in the middle of the growing season
        - listitem [ref=e44]: Wilting or curling when the ground isn't dry
        - listitem [ref=e45]: Leaves that come in smaller than normal
        - listitem [ref=e46]: Bare spots where leaves never filled in this spring
        - listitem [ref=e47]: Leaves dropping early, well before fall
      - paragraph [ref=e48]: One yellow leaf here or there is nothing. A whole section going pale or dropping in June is worth a closer look. Spots that spread, or a powdery coating, often point to a fungus, and Georgia's damp heat makes fungus a common problem.
      - heading "Check the branches and canopy" [level=2] [ref=e49]
      - paragraph [ref=e50]: Step back and look at the whole tree. A healthy canopy is thick and even. If you can see a lot of sky through the top, that thinning is a red flag.
      - paragraph [ref=e51]: Watch for branches that stay bare while the rest of the tree leafs out. Dead limbs mixed in with living ones tell you part of the tree is struggling. Snap a small twig. If it's brittle and brown inside instead of green and bendy, that branch is gone.
      - paragraph [ref=e52]: When the dieback starts at the top and works down, the tree is often fighting something at the roots or in the trunk. That's a sign to take seriously.
      - heading "Look hard at the trunk and bark" [level=2] [ref=e53]
      - paragraph [ref=e54]: The trunk holds a lot of answers. Walk all the way around it and run your eyes from the base up.
      - paragraph [ref=e55]: Mushrooms or shelf-like fungus growing on the trunk or over the roots is one of the clearest signs of trouble. That usually means the wood inside is rotting, even if the outside still looks solid. Trees like that can fail without much warning.
      - paragraph [ref=e56]: "Other trunk signs of tree disease include:"
      - list [ref=e57]:
        - listitem [ref=e58]: Cankers, which are sunken or dead patches on the bark
        - listitem [ref=e59]: Oozing sap or dark, wet-looking streaks
        - listitem [ref=e60]: Bark that's peeling, cracking, or falling off in sheets
        - listitem [ref=e61]: Sawdust piles or small round holes from boring insects
      - paragraph [ref=e62]: Those little holes matter here. Borers and beetles go after stressed pines and oaks all over Cobb, Fulton, and Gwinnett counties, and by the time you see the holes the bugs are usually already inside.
      - heading "Common tree problems in Georgia yards" [level=2] [ref=e63]
      - paragraph [ref=e64]: Some issues show up again and again around Atlanta. Pines that turn brown from the top down are often dealing with beetles or root stress after a wet season. Oaks can pick up fungal leaf diseases and slow decline, especially older ones that got their roots damaged during a build or a driveway job.
      - paragraph [ref=e65]: Crape myrtles get a white, powdery coating on the leaves, and many now carry crape myrtle bark scale, which leaves a black sooty film on the branches. None of that means the tree is doomed. It just means it needs attention before things get worse.
      - paragraph [ref=e66]:
        - text: If you're not sure whether you're looking at a sick tree or one that's already too far gone, our guide on
        - link "whether your tree is dead or dying" [ref=e67] [cursor=pointer]:
          - /url: /is-my-tree-dead-or-dying/
        - text: can help you tell the difference.
      - heading "What's treatable and what isn't" [level=2] [ref=e68]
      - paragraph [ref=e69]: Catching things early is everything. A lot of sick trees bounce back with the right care.
      - paragraph [ref=e70]: "Usually treatable:"
      - list [ref=e71]:
        - listitem [ref=e72]: Leaf diseases and mild fungus, often handled with pruning and better airflow
        - listitem [ref=e73]: Pest problems caught before they spread through the whole tree
        - listitem [ref=e74]:
          - text: Dead or crossing limbs that can be cleaned out with good
          - link "tree trimming and pruning" [ref=e75] [cursor=pointer]:
            - /url: /tree-trimming-pruning-services-in-metro-atlanta-ga/
        - listitem [ref=e76]: Stress from poor watering, bad soil, or crowded roots
      - paragraph [ref=e77]: "Harder to fix, or too far gone:"
      - list [ref=e78]:
        - listitem [ref=e79]: Rot deep in the trunk with fungus showing on the outside
        - listitem [ref=e80]: More than half the canopy dead
        - listitem [ref=e81]: Large cankers wrapped around the main stem
        - listitem [ref=e82]: Root rot that's already loosened the tree in the ground
      - paragraph [ref=e83]:
        - text: When a tree reaches that point, it can become a hazard. If yours is dropping big limbs or leaning, read up on the
        - link "signs you need problem tree removal" [ref=e84] [cursor=pointer]:
          - /url: /signs-you-need-problem-tree-removal/
        - text: before it fails on its own.
      - heading "Simple ways to keep trees healthy" [level=2] [ref=e85]
      - paragraph [ref=e86]: Most tree problems trace back to stress, and a lot of that stress is preventable. Give your trees a little help and they'll shrug off far more.
      - paragraph [ref=e87]: "A few things that go a long way:"
      - list [ref=e88]:
        - listitem [ref=e89]: Water deeply during dry spells, especially young trees and through Georgia's hot late summers
        - listitem [ref=e90]: Mulch a ring around the base, but keep it a few inches off the trunk so it doesn't hold rot against the bark
        - listitem [ref=e91]: Protect the roots during any yard project, since packed-down soil and cut roots do slow, hidden damage
        - listitem [ref=e92]: Prune out dead or rubbing branches before disease has a place to settle in
      - paragraph [ref=e93]: Small habits like these keep your trees strong enough to fight off the fungus and bugs that come with our climate.
      - heading "When to call a pro to diagnose it" [level=2] [ref=e94]
      - paragraph [ref=e95]: You can spot most warning signs yourself. Figuring out the exact cause, and whether the tree is worth saving, is where a trained set of eyes pays off.
      - paragraph [ref=e96]: Call a pro if you see mushrooms on the trunk, a fast decline, a big section dying back, or a lean that wasn't there before. A certified arborist can tell you if it's a sick tree you can treat or one that needs to come down for safety. Guessing wrong in either direction gets expensive.
      - paragraph [ref=e97]:
        - text: At Stanton Tree Service, we've helped Atlanta homeowners sort out sick and struggling trees since 2018. We're licensed, insured, and family-run, and we'll give you a straight answer. If something in your yard looks off, call us at
        - link "(470) 914-3402" [ref=e98] [cursor=pointer]:
          - /url: tel:+14709143402
        - text: for a free estimate and we'll take a look.
